name: Deploy Larissama PWA

# ============================================================
# TRIGGER
# ============================================================
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================
permissions:
  contents: read

# Jangan jalankan dua deployment production bersamaan
concurrency:
  group: larissama-pwa-production
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================
jobs:
  # ==========================================================
  # JOB 1 - BUILD DI GITHUB-HOSTED RUNNER
  # ==========================================================
  build:
    name: Build Quasar PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      QCLI_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://larissama.invalid/api/v1' || vars.QCLI_API_BASE_URL }}

    steps:
      # ------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ------------------------------------------------------
      # 2. SETUP NODE
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      # ------------------------------------------------------
      # 3. VALIDATE ENVIRONMENT
      # ------------------------------------------------------
      - name: Validate production environment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$QCLI_API_BASE_URL" ]; then
            echo "::error::QCLI_API_BASE_URL belum diatur."
            exit 1
          fi

          echo "Production environment available."

      # ------------------------------------------------------
      # 4. CREATE PRODUCTION ENV
      # ------------------------------------------------------
      - name: Create production environment
        shell: bash
        run: |
          set -euo pipefail

          printf 'QCLI_API_BASE_URL=%s\n' \
            "$QCLI_API_BASE_URL" > .env.production

          echo ".env.production created."

      # ------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # ------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci

      # ------------------------------------------------------
      # 6. CHECK SOURCE
      # ------------------------------------------------------
      - name: Run ESLint
        shell: bash
        run: |
          set -euo pipefail

          npx eslint -c ./eslint.config.js "./src*/**/*.{js,cjs,mjs,vue}"

      # ------------------------------------------------------
      # 7. BUILD QUASAR PWA
      # ------------------------------------------------------
      - name: Build Quasar PWA
        shell: bash
        run: |
          set -euo pipefail

          npx quasar build -m pwa

      # ------------------------------------------------------
      # 7. VERIFY BUILD
      # ------------------------------------------------------
      - name: Verify PWA build
        shell: bash
        run: |
          set -euo pipefail

          test -d dist/pwa
          test -f dist/pwa/index.html
          test -f dist/pwa/manifest.json
          test -f dist/pwa/sw.js

          echo "PWA build verified."
          du -sh dist/pwa

      # ------------------------------------------------------
      # 8. UPLOAD ARTIFACT
      # ------------------------------------------------------
      - name: Upload production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: larissama-pwa-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/pwa/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

      # ------------------------------------------------------
      # 9. CLEAN TEMP ENV
      # ------------------------------------------------------
      - name: Cleanup production environment
        if: always()
        shell: bash
        run: |
          rm -f .env.production

  # ==========================================================
  # JOB 2 - DEPLOY KE HOMELAB
  # ==========================================================
  deploy:
    name: Deploy to HOMELAB
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    runs-on:
      - self-hosted
      - Linux
      - X64
      - frondlarisama

    timeout-minutes: 15

    env:
      DEPLOY_PATH: /www/wwwroot/larissama.udumbara.my.id
      ARTIFACT_PATH: /tmp/larissama-pwa-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ------------------------------------------------------
      # 1. DOWNLOAD ARTIFACT
      # ------------------------------------------------------
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: larissama-pwa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_PATH }}

      # ------------------------------------------------------
      # 2. VERIFY ARTIFACT
      # ------------------------------------------------------
      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ARTIFACT_PATH/index.html"
          test -f "$ARTIFACT_PATH/manifest.json"
          test -f "$ARTIFACT_PATH/sw.js"

          echo "Production artifact verified."
          du -sh "$ARTIFACT_PATH"

      # ------------------------------------------------------
      # 3. CHECK DEPLOYMENT DIRECTORY
      # ------------------------------------------------------
      - name: Check deployment directory
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PATH="/www/wwwroot/larissama.udumbara.my.id"

          if [ "$DEPLOY_PATH" != "$EXPECTED_PATH" ]; then
            echo "::error::Unexpected deployment path."
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::Production directory not found."
            exit 1
          fi

          if [ ! -w "$DEPLOY_PATH" ]; then
            echo "::error::Runner has no write permission."
            exit 1
          fi

          echo "Deployment directory verified."

      # ------------------------------------------------------
      # 4. DEPLOY PWA
      # ------------------------------------------------------
      - name: Deploy PWA to aaPanel
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying Larissama PWA..."

          rsync \
            -rlv \
            --delete \
            --no-owner \
            --no-group \
            --no-perms \
            --omit-dir-times \
            --exclude=".user.ini" \
            --exclude=".htaccess" \
            --exclude=".well-known/" \
            --exclude="404.html" \
            --exclude="502.html" \
            "$ARTIFACT_PATH/" \
            "$DEPLOY_PATH/"

          echo "Rsync deployment completed."

      # ------------------------------------------------------
      # 5. VERIFY DEPLOYMENT
      # ------------------------------------------------------
      - name: Verify production deployment
        shell: bash
        run: |
          set -euo pipefail

          test -f "$DEPLOY_PATH/index.html"
          test -f "$DEPLOY_PATH/manifest.json"
          test -f "$DEPLOY_PATH/sw.js"

          echo "Production deployment verified."
          du -sh "$DEPLOY_PATH"

      # ------------------------------------------------------
      # 6. CLEANUP ARTIFACT
      # ------------------------------------------------------
      - name: Cleanup temporary artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PREFIX="/tmp/larissama-pwa-"

          if [[ "$ARTIFACT_PATH" == "$EXPECTED_PREFIX"* ]] &&
             [[ "$ARTIFACT_PATH" != "$EXPECTED_PREFIX" ]]; then
            rm -rf -- "$ARTIFACT_PATH"
            echo "Temporary artifact removed."
          fi

      # ------------------------------------------------------
      # 7. FINISH
      # ------------------------------------------------------
      - name: Deployment completed
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo " LARISSAMA PWA DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo "Application : Larissama"
          echo "Mode        : Quasar PWA"
          echo "Production  : $DEPLOY_PATH"
          echo "=========================================="
