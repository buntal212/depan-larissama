name: Deploy Larissama PWA

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: larissama-pwa-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # BUILD DI GITHUB, BUKAN DI HOMELAB
  # ==========================================
  build:
    name: Build Quasar PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      QCLI_API_BASE_URL: ${{ vars.QCLI_API_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Validate production environment
        shell: bash
        run: |
          if [ -z "$QCLI_API_BASE_URL" ]; then
            echo "::error::QCLI_API_BASE_URL belum diatur"
            exit 1
          fi

      - name: Create production environment
        shell: bash
        run: |
          printf 'QCLI_API_BASE_URL=%s\n' \
            "$QCLI_API_BASE_URL" > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build Quasar PWA
        run: npx quasar build -m pwa

      - name: Verify build
        shell: bash
        run: |
          test -f dist/pwa/index.html
          test -f dist/pwa/manifest.json
          test -f dist/pwa/sw.js

          echo "Build size:"
          du -sh dist/pwa

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: larissama-pwa-${{ github.run_id }}
          path: dist/pwa/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # DEPLOY DI HOMELAB TANPA BUILD
  # ==========================================
  deploy:
    name: Deploy to HOMELAB
    needs: build

    runs-on:
      - self-hosted
      - Linux
      - X64
      - frondlarisama

    timeout-minutes: 15

    env:
      DEPLOY_PATH: /www/wwwroot/larissama.udumbara.my.id
      ARTIFACT_PATH: ${{ runner.temp }}/larissama-pwa-${{ github.run_id }}

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: larissama-pwa-${{ github.run_id }}
          path: ${{ runner.temp }}/larissama-pwa-${{ github.run_id }}

      - name: Verify artifact and destination
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ARTIFACT_PATH/index.html"
          test -f "$ARTIFACT_PATH/manifest.json"
          test -f "$ARTIFACT_PATH/sw.js"

          test -d "$DEPLOY_PATH"
          test -w "$DEPLOY_PATH"

          if [ "$DEPLOY_PATH" != \
            "/www/wwwroot/larissama.udumbara.my.id" ]; then
            echo "::error::Unexpected deployment path"
            exit 1
          fi

          echo "Artifact:"
          du -sh "$ARTIFACT_PATH"

      - name: Deploy PWA to aaPanel
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            -rlv \
            --delete \
            --no-owner \
            --no-group \
            --no-perms \
            --omit-dir-times \
            --exclude=".user.ini" \
            --exclude=".htaccess" \
            --exclude=".well-known/" \
            --exclude="404.html" \
            --exclude="502.html" \
            "$ARTIFACT_PATH/" \
            "$DEPLOY_PATH/"

      - name: Verify production deployment
        shell: bash
        run: |
          set -euo pipefail

          test -f "$DEPLOY_PATH/index.html"
          test -f "$DEPLOY_PATH/manifest.json"
          test -f "$DEPLOY_PATH/sw.js"

          echo "Production deployment verified."
          du -sh "$DEPLOY_PATH"

      - name: Cleanup downloaded artifact
        if: always()
        shell: bash
        run: |
          if [[ "$ARTIFACT_PATH" == \
            "${RUNNER_TEMP}/larissama-pwa-"* ]]; then
            rm -rf -- "$ARTIFACT_PATH"
          fi

      - name: Deployment completed
        if: success()
        run: |
          echo "Larissama PWA deployed successfully."
          echo "Production: $DEPLOY_PATH"
