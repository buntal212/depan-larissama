name: Deploy Larissama PWA

# ============================================================
# TRIGGER
# ============================================================
on:
  push:
    branches:
      - master

  # Bisa dijalankan manual dari GitHub > Actions
  workflow_dispatch:

# ============================================================
# GITHUB PERMISSIONS
# ============================================================
permissions:
  contents: read

# Jangan menjalankan dua deployment production bersamaan
concurrency:
  group: larissama-pwa-production
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================
jobs:
  deploy:
    name: Build & Deploy Quasar PWA

    # ========================================================
    # SELF-HOSTED RUNNER
    # ========================================================
    runs-on:
      - self-hosted
      - Linux
      - X64
      - frondlarisama

    timeout-minutes: 30

    # ========================================================
    # GLOBAL ENVIRONMENT
    # ========================================================
    env:
      # Folder production website aaPanel
      DEPLOY_PATH: /www/wwwroot/larissama.udumbara.my.id

      # Cache npm khusus user runner.
      # Tidak menggunakan cache global Node milik aaPanel.
      npm_config_cache: /home/kentang/.npm

    steps:
      # ======================================================
      # 1. CHECKOUT SOURCE CODE
      # ======================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true

      # ======================================================
      # 2. SETUP NODE.JS
      #
      # Node 22.22.0 hanya digunakan oleh job GitHub Actions.
      # Node aaPanel dan project lain tidak berubah.
      # ======================================================
      - name: Setup Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      # ======================================================
      # 3. CHECK RUNNER ENVIRONMENT
      # ======================================================
      - name: Check runner environment
        run: |
          echo "=========================================="
          echo " LARISSAMA PWA DEPLOYMENT"
          echo "=========================================="

          echo ""
          echo "Runner user:"
          whoami

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Node version:"
          node -v

          echo ""
          echo "NPM version:"
          npm -v

          echo ""
          echo "Node location:"
          which node

          echo ""
          echo "NPM location:"
          which npm

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "NPM cache:"
          npm config get cache

          echo ""
          echo "Deploy path:"
          echo "$DEPLOY_PATH"

      # ======================================================
      # 4. PREPARE NPM CACHE
      # ======================================================
      - name: Prepare npm cache
        run: |
          echo "Preparing npm cache..."

          mkdir -p "$npm_config_cache"

          echo ""
          echo "NPM cache directory:"
          ls -ld "$npm_config_cache"

      # ======================================================
      # 5. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          echo "=========================================="
          echo " Installing dependencies"
          echo "=========================================="

          npm ci

      # ======================================================
      # 6. BUILD QUASAR PWA
      # ======================================================
      - name: Build Quasar PWA
        run: |
          echo "=========================================="
          echo " Building Quasar PWA"
          echo "=========================================="

          npx quasar build -m pwa

      # ======================================================
      # 7. VERIFY PWA BUILD
      # ======================================================
      - name: Verify PWA build
        run: |
          echo "=========================================="
          echo " Verifying PWA build"
          echo "=========================================="

          if [ ! -d "dist/pwa" ]; then
            echo ""
            echo "ERROR:"
            echo "Folder dist/pwa tidak ditemukan."
            exit 1
          fi

          if [ ! -f "dist/pwa/index.html" ]; then
            echo ""
            echo "ERROR:"
            echo "dist/pwa/index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "PWA build berhasil."
          echo ""

          echo "Build size:"
          du -sh dist/pwa

          echo ""
          echo "Build contents:"
          ls -lah dist/pwa

      # ======================================================
      # 8. CHECK PRODUCTION DIRECTORY
      # ======================================================
      - name: Check deploy directory
        run: |
          echo "=========================================="
          echo " Checking deployment directory"
          echo "=========================================="

          echo ""
          echo "Target:"
          echo "$DEPLOY_PATH"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo ""
            echo "ERROR:"
            echo "Folder production tidak ditemukan:"
            echo "$DEPLOY_PATH"
            exit 1
          fi

          if [ ! -w "$DEPLOY_PATH" ]; then
            echo ""
            echo "ERROR:"
            echo "Runner tidak memiliki write permission:"
            echo "$DEPLOY_PATH"
            exit 1
          fi

          echo ""
          echo "Deployment directory OK:"
          ls -ld "$DEPLOY_PATH"

      # ======================================================
      # 9. DEPLOY PWA TO AAPANEL
      #
      # --delete:
      #   Menghapus file build lama yang sudah tidak digunakan.
      #
      # --no-owner / --no-group:
      #   Mencegah rsync mencoba chown/chgrp.
      #
      # File/folder milik aaPanel dan SSL dikecualikan.
      # ======================================================
      - name: Deploy PWA to aaPanel
        run: |
          echo "=========================================="
          echo " Deploying Larissama PWA"
          echo "=========================================="

          rsync \
            -rlv \
            --delete \
            --no-owner \
            --no-group \
            --no-perms \
            --omit-dir-times \
            --exclude=".user.ini" \
            --exclude=".htaccess" \
            --exclude=".well-known/" \
            --exclude="404.html" \
            --exclude="502.html" \
            dist/pwa/ \
            "$DEPLOY_PATH/"

      # ======================================================
      # 10. VERIFY PRODUCTION DEPLOYMENT
      # ======================================================
      - name: Verify deployment
        run: |
          echo "=========================================="
          echo " Verifying production deployment"
          echo "=========================================="

          if [ ! -f "$DEPLOY_PATH/index.html" ]; then
            echo ""
            echo "ERROR:"
            echo "Production index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "index.html ditemukan."

          echo ""
          echo "Production files:"
          ls -lah "$DEPLOY_PATH"

          echo ""
          echo "Production size:"
          du -sh "$DEPLOY_PATH"

      # ======================================================
      # 11. CHECK IMPORTANT AAPANEL FILES
      # ======================================================
      - name: Check protected aaPanel files
        run: |
          echo "=========================================="
          echo " Checking protected files"
          echo "=========================================="

          if [ -f "$DEPLOY_PATH/.user.ini" ]; then
            echo "OK: .user.ini tetap ada"
          else
            echo "INFO: .user.ini tidak ditemukan"
          fi

          if [ -d "$DEPLOY_PATH/.well-known" ]; then
            echo "OK: .well-known tetap ada"
          else
            echo "INFO: .well-known tidak ditemukan"
          fi

          if [ -f "$DEPLOY_PATH/404.html" ]; then
            echo "OK: 404.html tetap ada"
          else
            echo "INFO: 404.html tidak ditemukan"
          fi

          if [ -f "$DEPLOY_PATH/502.html" ]; then
            echo "OK: 502.html tetap ada"
          else
            echo "INFO: 502.html tidak ditemukan"
          fi

      # ======================================================
      # 12. DEPLOYMENT COMPLETED
      # ======================================================
      - name: Deployment completed
        run: |
          echo ""
          echo "=========================================="
          echo " LARISSAMA PWA DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo ""

          echo "Application:"
          echo "Larissama"

          echo ""
          echo "Build mode:"
          echo "Quasar PWA"

          echo ""
          echo "Node:"
          node -v

          echo ""
          echo "Production path:"
          echo "$DEPLOY_PATH"

          echo ""
          echo "Deployment completed successfully."
