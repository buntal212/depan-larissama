name: Deploy Larissama PWA

# ============================================================
# TRIGGER
# ============================================================
on:
  push:
    branches:
      - master

  # Bisa dijalankan manual dari GitHub Actions
  workflow_dispatch:

# ============================================================
# GITHUB PERMISSIONS
# ============================================================
permissions:
  contents: read

# Hindari dua deployment production berjalan bersamaan
concurrency:
  group: larissama-pwa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Quasar PWA

    # ========================================================
    # SELF-HOSTED RUNNER
    # ========================================================
    runs-on:
      - self-hosted
      - Linux
      - X64
      - frondlarisama

    timeout-minutes: 30

    # ========================================================
    # GLOBAL ENV
    # ========================================================
    env:
      # Folder website aaPanel
      DEPLOY_PATH: /www/wwwroot/larissama.udumbara.my.id

      # Cache npm khusus user runner.
      # Tidak menggunakan cache global Node milik aaPanel.
      npm_config_cache: /home/kentang/.npm

    steps:
      # ======================================================
      # 1. CHECKOUT SOURCE CODE
      # ======================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true

      # ======================================================
      # 2. SETUP NODE
      #
      # Node ini hanya digunakan selama job GitHub Actions.
      # Node aaPanel/project lain TIDAK berubah.
      # ======================================================
      - name: Setup Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'

      # ======================================================
      # 3. CHECK ENVIRONMENT
      # ======================================================
      - name: Check runner environment
        run: |
          echo "=========================================="
          echo " LARISSAMA PWA DEPLOYMENT"
          echo "=========================================="

          echo ""
          echo "Runner user:"
          whoami

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Node:"
          node -v

          echo ""
          echo "NPM:"
          npm -v

          echo ""
          echo "Node location:"
          which node

          echo ""
          echo "NPM location:"
          which npm

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "NPM cache:"
          npm config get cache

          echo ""
          echo "Deploy path:"
          echo "$DEPLOY_PATH"

      # ======================================================
      # 4. PREPARE NPM CACHE
      # ======================================================
      - name: Prepare npm cache
        run: |
          mkdir -p "$npm_config_cache"

          echo "NPM cache:"
          ls -ld "$npm_config_cache"

      # ======================================================
      # 5. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          echo "=========================================="
          echo " Installing dependencies"
          echo "=========================================="

          npm ci

      # ======================================================
      # 6. BUILD QUASAR PWA
      # ======================================================
      - name: Build Quasar PWA
        run: |
          echo "=========================================="
          echo " Building Quasar PWA"
          echo "=========================================="

          npx quasar build -m pwa

      # ======================================================
      # 7. VERIFY BUILD RESULT
      # ======================================================
      - name: Verify PWA build
        run: |
          echo "Checking dist/pwa..."

          if [ ! -d "dist/pwa" ]; then
            echo "ERROR: Folder dist/pwa tidak ditemukan."
            exit 1
          fi

          if [ ! -f "dist/pwa/index.html" ]; then
            echo "ERROR: dist/pwa/index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "PWA build berhasil."
          echo ""

          echo "Build size:"
          du -sh dist/pwa

          echo ""
          echo "Build files:"
          ls -lah dist/pwa

      # ======================================================
      # 8. CHECK DEPLOY TARGET
      # ======================================================
      - name: Check deploy directory
        run: |
          echo "Checking:"
          echo "$DEPLOY_PATH"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo ""
            echo "ERROR: Folder website tidak ditemukan:"
            echo "$DEPLOY_PATH"
            exit 1
          fi

          if [ ! -w "$DEPLOY_PATH" ]; then
            echo ""
            echo "ERROR: Runner tidak memiliki write permission:"
            echo "$DEPLOY_PATH"
            exit 1
          fi

          echo ""
          echo "Deploy directory OK:"
          ls -ld "$DEPLOY_PATH"

      # ======================================================
      # 9. DEPLOY PWA TO AAPANEL
      # ======================================================
      - name: Deploy PWA to aaPanel
        run: |
          echo "=========================================="
          echo " Deploying Larissama PWA"
          echo "=========================================="

          rsync \
            -av \
            --delete \
            --exclude=".user.ini" \
            --exclude=".htaccess" \
            dist/pwa/ \
            "$DEPLOY_PATH/"

      # ======================================================
      # 10. VERIFY PRODUCTION FILES
      # ======================================================
      - name: Verify deployment
        run: |
          echo "=========================================="
          echo " Verifying production"
          echo "=========================================="

          if [ ! -f "$DEPLOY_PATH/index.html" ]; then
            echo "ERROR: Production index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "Production files:"
          ls -lah "$DEPLOY_PATH"

          echo ""
          echo "Production size:"
          du -sh "$DEPLOY_PATH"

      # ======================================================
      # 11. DEPLOYMENT FINISHED
      # ======================================================
      - name: Deployment completed
        run: |
          echo ""
          echo "=========================================="
          echo " LARISSAMA PWA DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo ""
          echo "Node:"
          node -v
          echo ""
          echo "Production path:"
          echo "$DEPLOY_PATH"
          echo ""
